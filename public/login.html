<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sign in · Pokémon Binder Ledger</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/archivo/wdth.css">
<link rel="stylesheet" href="styles.css">
<script src="login.js" defer></script>
</head>
<body>
<main class="signin">
  <form class="mcard narrow" id="signinForm">
    <h1>Pokémon Binder Ledger</h1>
    <p class="lead">Enter the ledger's password.</p>
    <div class="field"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required autofocus></div>
    <p class="hint" id="msg" role="alert"></p>
    <div class="mfoot"><button class="btn primary" type="submit" id="go">Sign in</button></div>
  </form>
</main>
</body>
</html>
